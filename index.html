<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TonozShare - Premium Transfer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        
        /* APP MODU (Mobil Uyumlu): Gövde sabitlenir, iç yapılar kendi alanında kayar */
        html, body { width: 100vw; height: 100dvh; overflow: hidden; font-family: 'Outfit', sans-serif; background-color: #020617; color: #e2e8f0; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        /* HAREKETLİ DUMAN EFEKTİ (Mavi-Beyaz Tema) */
        .smoke-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: #02040a; }
        .smoke { position: absolute; border-radius: 50%; filter: blur(80px); mix-blend-mode: screen; animation: smokeMove 25s infinite alternate ease-in-out; transform: translateZ(0); }
        .smoke-1 { width: 70vw; height: 70vw; background: #1e3a8a; left: -10%; top: -10%; opacity: 0.6; animation-duration: 30s; }
        .smoke-2 { width: 60vw; height: 60vw; background: #0ea5e9; right: -10%; bottom: -10%; opacity: 0.5; animation-duration: 25s; animation-direction: alternate-reverse; }
        .smoke-3 { width: 80vw; height: 80vw; background: #ffffff; left: 10%; top: 20%; opacity: 0.15; filter: blur(100px); animation-duration: 35s; }
        
        @keyframes smokeMove {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(5%, 10%) scale(1.1) rotate(5deg); }
            66% { transform: translate(-5%, 5%) scale(1.05) rotate(-5deg); }
            100% { transform: translate(10%, -5%) scale(1.2) rotate(5deg); }
        }

        /* ANA TAŞIYICI DÜZENİ */
        #app-container { display: flex; flex-direction: column; width: 100vw; height: 100dvh; position: relative; z-index: 10; }
        
        /* ÜST BAR (SABİT) */
        header { flex-shrink: 0; background: rgba(0, 0, 0, 0.3); border-bottom: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 50; }
        
        /* İÇERİK ALANI (Kaydırılabilir) */
        #views-container { flex-grow: 1; position: relative; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; }

        /* 3D CAM EFEKTİ (Glassmorphism) */
        .glass-3d { 
            background: rgba(15, 20, 25, 0.45); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.3); border-left: 1px solid rgba(255, 255, 255, 0.15); border-bottom: 1px solid rgba(255, 255, 255, 0.05); border-right: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 0 20px rgba(255, 255, 255, 0.05); border-radius: 1.5rem; 
        }
        .glass-panel { background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.08); border-top: 1px solid rgba(255,255,255,0.15); box-shadow: inset 0 2px 10px rgba(0,0,0,0.4); }
        .glass-input { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
        .glass-input:focus, .glass-btn-active { border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); outline: none; background: rgba(0, 0, 0, 0.8); color: #60a5fa !important; }

        /* EKRAN GEÇİŞLERİ */
        .view-section { display: none; flex-direction: column; flex-grow: 1; padding: 1.5rem 1rem; opacity: 0; transform: scale(0.98) translateY(10px); transition: all 0.4s ease-out; }
        .view-section.active { display: flex; opacity: 1; transform: scale(1) translateY(0); }

        /* ATOM YÜKLEME ANİMASYONU (Mavi Tema) */
        .atom-spinner { width: 100px; height: 100px; position: relative; perspective: 800px; margin: 0 auto 2rem auto; }
        .atom-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .atom-ring-1 { border-top-color: #3b82f6; border-bottom-color: #3b82f6; animation: spinX 1.5s linear infinite; filter: drop-shadow(0 0 10px #3b82f6); }
        .atom-ring-2 { border-left-color: #60a5fa; border-right-color: #60a5fa; animation: spinY 2s linear infinite; filter: drop-shadow(0 0 10px #60a5fa); }
        .atom-ring-3 { border-top-color: #ffffff; border-bottom-color: #ffffff; animation: spinZ 2.5s linear infinite; filter: drop-shadow(0 0 10px #ffffff); }
        .atom-core { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; background: #fff; border-radius: 50%; box-shadow: 0 0 30px 10px #fff; animation: pulseCore 1s infinite alternate; }
        
        @keyframes spinX { 100% { transform: rotateX(360deg) rotateY(180deg); } }
        @keyframes spinY { 100% { transform: rotateY(360deg) rotateZ(180deg); } }
        @keyframes spinZ { 100% { transform: rotateZ(360deg) rotateX(180deg); } }
        @keyframes pulseCore { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; } 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }

        /* Başarı İkonu */
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .success-animate { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Mavi Lazer Progress Bar */
        .progress-track { background: rgba(0,0,0,0.8); border-radius: 99px; height: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); box-shadow: inset 0 2px 10px rgba(0,0,0,0.8); }
        .progress-fill { height: 100%; border-radius: 99px; width: 0%; background: linear-gradient(90deg, #1e3a8a, #3b82f6, #93c5fd); background-size: 200% 200%; transition: width 0.3s ease-out; box-shadow: 0 0 20px rgba(59, 130, 246, 0.8); }
        .progress-success { background: #22c55e !important; box-shadow: 0 0 30px rgba(34, 197, 94, 0.8) !important; }

        .drop-zone { transition: all 0.3s ease; }
        .drop-zone.dragover { background: rgba(59, 130, 246, 0.15) !important; border-color: #3b82f6 !important; transform: scale(1.02); box-shadow: 0 0 30px rgba(59, 130, 246, 0.2); }
        
        /* Özel İnce Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>

    <!-- ARKA PLAN DUMAN EFEKTİ -->
    <div class="smoke-bg">
        <div class="smoke smoke-1"></div>
        <div class="smoke smoke-2"></div>
        <div class="smoke smoke-3"></div>
    </div>

    <div id="app-container">
        
        <!-- TEK VE ORTAK ÜST BAR (Mavi/Beyaz TonozShare Logolu) -->
        <header class="w-full px-4 py-3 md:px-6 md:py-4 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer group" onclick="switchView('uploadView')">
                <div class="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-gradient-to-tr from-blue-600 to-blue-300 flex items-center justify-center shadow-[0_0_20px_rgba(59,130,246,0.5)] transition-all transform group-hover:scale-105 border border-blue-400/30">
                    <i class="fas fa-bolt text-white text-xl md:text-2xl"></i>
                </div>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight drop-shadow-lg">
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-white">Tonoz</span><span class="text-blue-200 font-light">Share</span>
                </h1>
            </div>
            
            <button id="navLoginBtn" onclick="switchView('loginView')" class="px-4 py-2 md:px-5 md:py-2.5 rounded-full glass-3d hover:bg-white/10 transition-all flex items-center gap-2 text-xs md:text-sm font-bold text-blue-400 border border-blue-500/30">
                <i class="fas fa-lock"></i> <span class="hidden md:inline">Yönetim Paneli</span>
            </button>
            <button id="navLogoutBtn" onclick="logoutAdmin()" class="hidden px-4 py-2 md:px-5 md:py-2.5 rounded-full glass-3d hover:bg-red-500/20 transition-all flex items-center gap-2 text-xs md:text-sm font-bold text-red-400 border border-red-500/30">
                <i class="fas fa-power-off"></i> <span class="hidden md:inline">Çıkış Yap</span>
            </button>
        </header>

        <!-- MERKEZİ İÇERİK ALANI (Kaydırılabilir Alan) -->
        <div id="views-container">
            
            <!-- 1. YÜKLEME EKRANI -->
            <main id="uploadView" class="view-section active justify-center items-center">
                <div class="glass-3d w-full max-w-4xl p-5 md:p-8 flex flex-col md:flex-row gap-6 relative mx-auto my-auto">
                    
                    <!-- Sol: Form -->
                    <div class="w-full md:w-1/2 flex flex-col gap-4">
                        <div class="text-left mb-2 hidden md:block">
                            <h2 class="text-2xl font-bold text-white mb-1 drop-shadow-md">Dosya Aktarımı</h2>
                            <p class="text-gray-400 text-xs">Drive alanına şifreli ve güvenli aktarım.</p>
                        </div>
                        <input type="text" id="senderNameInput" class="glass-input w-full px-5 py-3.5 rounded-xl text-sm font-medium" placeholder="Adınız / Firmanız">
                        <textarea rows="2" id="senderNoteInput" class="glass-input w-full px-5 py-3.5 rounded-xl text-sm resize-none font-medium" placeholder="Notunuz (İsteğe Bağlı)..."></textarea>
                    </div>

                    <!-- Sağ: Klasör / Sürükle Bırak / Yükleme Animasyonu -->
                    <div class="w-full md:w-1/2 relative min-h-[250px] flex flex-col glass-panel rounded-2xl p-4">
                        
                        <!-- Boş Durum -->
                        <div id="defaultDropZone" class="drop-zone absolute inset-2 border-2 border-dashed border-white/20 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer group" onclick="document.getElementById('fileInput').click()">
                            <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mb-3 group-hover:scale-110 transition-transform duration-300 shadow-lg border border-white/10">
                                <i class="fas fa-cloud-upload-alt text-3xl text-blue-400"></i>
                            </div>
                            <h3 class="text-white font-bold text-base">Dosya / Klasör Sürükle</h3>
                            <p class="text-gray-400 text-[11px] mt-1">veya seçmek için tıkla</p>
                            <input type="file" id="fileInput" class="hidden" multiple>
                        </div>

                        <!-- Aktif Durum (İçi Dolu) -->
                        <div id="activeDropZone" class="hidden flex-col h-full z-10 drop-zone rounded-xl">
                            <div class="flex justify-between items-center px-1 pb-2 border-b border-white/10 mb-2">
                                <span class="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Kuyruk (<span id="fileCount">0</span>)</span>
                                <span class="text-[10px] text-white font-bold bg-black/50 px-2 py-1 rounded border border-white/10" id="totalSizeText">0 MB</span>
                            </div>
                            <div id="fileListUI" class="flex-grow overflow-y-auto space-y-2 pr-1 h-32 md:h-40"></div>
                            <div class="flex gap-2 mt-3 pt-3 border-t border-white/10">
                                <button onclick="document.getElementById('fileInput').click()" class="flex-1 bg-black/40 hover:bg-black/60 text-white font-bold py-3 rounded-xl transition border border-white/10 text-xs">
                                    <i class="fas fa-plus"></i> Ekle
                                </button>
                                <button onclick="startUpload()" class="flex-[2] bg-gradient-to-r from-blue-600 to-blue-400 hover:from-blue-500 hover:to-blue-300 text-white font-bold py-3 rounded-xl transition shadow-[0_0_20px_rgba(59,130,246,0.5)] text-xs border border-blue-400/50">
                                    <i class="fas fa-rocket mr-1"></i> Başlat
                                </button>
                            </div>
                        </div>

                        <!-- 3D Atom Yükleme Ekranı -->
                        <div id="progressArea" class="hidden absolute inset-0 glass-3d rounded-2xl flex-col items-center justify-center p-6 text-center z-20">
                            <div id="spinner" class="atom-spinner">
                                <div class="atom-ring atom-ring-1"></div><div class="atom-ring atom-ring-2"></div><div class="atom-ring atom-ring-3"></div><div class="atom-core"></div>
                            </div>
                            <i id="successIcon" class="fas fa-check-circle text-6xl text-green-400 hidden mb-6 drop-shadow-[0_0_30px_rgba(34,197,94,0.8)]"></i>
                            
                            <h3 id="uploadStatusTitle" class="text-white font-bold text-lg md:text-xl mb-4 drop-shadow-md">Sisteme Aktarılıyor...</h3>
                            
                            <div class="progress-track w-full mb-2"><div class="progress-fill" id="progressBar"></div></div>
                            <div class="flex justify-between text-[10px] font-bold w-full mb-4">
                                <span class="text-blue-400 drop-shadow-sm" id="progressText">0%</span>
                                <span class="text-gray-400" id="speedText">Hazırlanıyor...</span>
                            </div>
                            <button id="continueUploadBtn" onclick="continueUpload()" class="hidden w-full bg-white/10 hover:bg-white/20 text-white font-bold py-3 rounded-xl transition border border-white/20 text-xs mt-2">
                                <i class="fas fa-folder-plus mr-1"></i> Dosya Ekle
                            </button>
                        </div>
                    </div>
                </div>
            </main>

            <!-- 2. ŞİFRE EKRANI -->
            <main id="loginView" class="view-section justify-center items-center">
                <div class="glass-3d w-full max-w-xs p-8 text-center flex flex-col items-center mx-auto my-auto">
                    <i class="fas fa-user-shield text-5xl text-blue-400 mb-6 drop-shadow-[0_0_20px_rgba(59,130,246,0.6)]"></i>
                    <h2 class="text-xl font-bold text-white mb-6">Yönetici Girişi</h2>
                    <input type="password" id="adminPassword" class="glass-input w-full px-4 py-3.5 rounded-xl mb-5 text-center text-xl tracking-[0.4em]" placeholder="••••••••" onkeypress="if(event.key === 'Enter') checkLogin()">
                    <button id="loginBtn" onclick="checkLogin()" class="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-gray-200 transition-colors shadow-[0_0_20px_rgba(255,255,255,0.4)]">Erişim İste</button>
                </div>
            </main>

            <!-- 3. ADMİN PANELİ -->
            <main id="adminView" class="view-section items-center pb-12">
                <div class="w-full max-w-7xl flex flex-col gap-4">
                    <!-- Arama ve Buton Barı -->
                    <div class="glass-3d p-4 flex flex-col md:flex-row justify-between items-center gap-4 flex-shrink-0">
                        <div class="w-full md:w-1/3 relative">
                            <i class="fas fa-search absolute left-3.5 top-3 text-gray-400 text-xs"></i>
                            <input type="text" id="searchInput" onkeyup="filterCards()" placeholder="Firma veya Dosya Ara..." class="glass-input w-full pl-9 pr-3 py-2.5 rounded-xl text-xs font-medium">
                        </div>
                        <div class="flex w-full md:w-auto gap-3 justify-between items-center">
                            <div class="glass-panel px-3 py-1.5 rounded-xl flex items-center shadow-lg">
                                <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse mr-2 drop-shadow-[0_0_5px_rgba(74,222,128,0.8)]"></span>
                                <span class="text-[10px] text-gray-300 font-medium mr-3 hidden sm:inline">Sistem Güncel</span>
                                <div class="text-right border-l border-white/10 pl-3">
                                    <p class="text-[8px] text-gray-400 uppercase font-bold mb-0.5">Toplam</p>
                                    <p class="text-xs font-bold text-white leading-none" id="globalSizeDisplay">0 MB</p>
                                </div>
                            </div>
                            <div class="flex gap-1.5">
                                <button id="btnGrid" onclick="setView('grid')" class="glass-input text-gray-400 px-3 py-2 rounded-xl transition flex justify-center"><i class="fas fa-th-large text-xs"></i></button>
                                <button id="btnList" onclick="setView('list')" class="glass-input text-gray-400 glass-btn-active px-3 py-2 rounded-xl transition flex justify-center"><i class="fas fa-list text-xs"></i></button>
                            </div>
                        </div>
                    </div>

                    <!-- Dosya Kartları Alanı -->
                    <div id="adminCardsContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 content-start"></div>
                </div>
            </main>
            
            <!-- İMZA SABİT (Sayfanın en alt kısmında yer alır) -->
            <footer class="w-full text-center py-4 flex-shrink-0">
                <span class="text-[9px] font-bold tracking-[0.3em] text-white/30 drop-shadow-md">CREATED BY TONOZ</span>
            </footer>

        </div> <!-- Views Container Sonu -->
    </div> <!-- App Container Sonu -->

    <!-- DÜZENLEME PENCERESİ (MODAL) -->
    <div id="editModal" class="fixed inset-0 bg-black/80 backdrop-blur-lg z-[60] hidden flex items-center justify-center p-4 transition-opacity">
        <div class="glass-3d w-full max-w-sm p-6 relative">
            <h3 class="text-lg font-bold text-white mb-4">Gönderiyi Düzenle</h3>
            <input type="hidden" id="editFolderId"><input type="hidden" id="editTimeStr">
            <div class="space-y-3">
                <div>
                    <label class="text-[9px] text-gray-400 font-bold mb-1 block uppercase">Adınız / Firmanız</label>
                    <input type="text" id="editSenderName" class="glass-input w-full px-4 py-2.5 rounded-xl text-sm">
                </div>
                <div>
                    <label class="text-[9px] text-gray-400 font-bold mb-1 block uppercase">Not (Açıklama)</label>
                    <textarea rows="3" id="editSenderNote" class="glass-input w-full px-4 py-2.5 rounded-xl text-sm resize-none"></textarea>
                </div>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeEditModal()" class="flex-1 bg-white/10 hover:bg-white/20 text-white font-bold py-2.5 rounded-xl transition text-xs border border-white/10">İptal</button>
                <button onclick="saveEdit()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl transition shadow-[0_0_20px_rgba(59,130,246,0.5)] text-xs border border-blue-400/50">Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'list';
        let selectedFilesData = [];
        let realAdminData = [];
        let secureSessionToken = '';
        let currentSessionFolderId = null;

        // EKRAN VE BUTON YÖNETİCİSİ
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => {
                el.classList.remove('active');
                el.style.display = 'none'; 
            });
            
            const target = document.getElementById(viewId);
            target.style.display = 'flex';
            setTimeout(() => { target.classList.add('active'); }, 10);

            // Dinamik Üst Bar Butonları
            document.getElementById('navLoginBtn').style.display = viewId === 'uploadView' ? 'flex' : 'none';
            document.getElementById('navLogoutBtn').style.display = viewId === 'adminView' ? 'flex' : 'none';

            if(viewId === 'loginView') { 
                document.getElementById('adminPassword').value = ''; 
                setTimeout(() => { document.getElementById('adminPassword').focus(); }, 100); 
            }
        }

        async function checkLogin() {
            const pwd = document.getElementById('adminPassword').value;
            const btn = document.getElementById('loginBtn');
            if(!pwd) return;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Doğrulanıyor...'; btn.disabled = true;
            try {
                const response = await fetch('https://tonoz-backend.onrender.com/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd })
                });
                const result = await response.json();
                if (result.success) { 
                    secureSessionToken = result.token; 
                    switchView('adminView'); 
                    loadAdminData(); 
                } else { alert("Hatalı Şifre!"); }
            } catch (err) { alert("Sunucuya bağlanılamadı."); }
            btn.innerHTML = 'Erişim İste'; btn.disabled = false;
        }

        function logoutAdmin() { secureSessionToken = ''; switchView('uploadView'); }

        // --- SÜRÜKLE BIRAK SİSTEMİ ---
        const dropZones = [document.getElementById('defaultDropZone'), document.getElementById('activeDropZone')];
        const fileInput = document.getElementById('fileInput');
        
        dropZones.forEach(dz => {
            dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
            dz.addEventListener('dragleave', e => { e.preventDefault(); dz.classList.remove('dragover'); });
            dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
        });
        
        fileInput.addEventListener('change', e => { handleFiles(e.target.files); fileInput.value = ''; });

        function handleFiles(files) {
            if(files.length === 0) return;
            if(!document.getElementById('progressArea').classList.contains('hidden') && !document.getElementById('successIcon').classList.contains('hidden')) {
                continueUpload();
            }
            selectedFilesData = selectedFilesData.concat(Array.from(files));
            updateFileListUI();
        }

        function removeFile(index) { selectedFilesData.splice(index, 1); updateFileListUI(); }

        function updateFileListUI() {
            if(selectedFilesData.length === 0) {
                document.getElementById('activeDropZone').classList.add('hidden');
                document.getElementById('activeDropZone').classList.remove('flex');
                document.getElementById('defaultDropZone').classList.remove('hidden');
                return;
            }
            document.getElementById('defaultDropZone').classList.add('hidden');
            document.getElementById('activeDropZone').classList.remove('hidden');
            document.getElementById('activeDropZone').classList.add('flex');
            
            let totalBytes = selectedFilesData.reduce((acc, file) => acc + file.size, 0);
            let totalMB = (totalBytes / (1024*1024)).toFixed(2);
            document.getElementById('fileCount').innerText = selectedFilesData.length;
            document.getElementById('totalSizeText').innerText = totalMB + " MB";
            
            document.getElementById('fileListUI').innerHTML = selectedFilesData.map((f, i) => `
                <div class="glass-panel p-2 rounded-lg flex justify-between items-center group border border-white/5 bg-black/40">
                    <div class="flex items-center gap-2 text-xs text-gray-200 truncate pr-1">
                        <i class="fas fa-file-alt text-blue-400"></i> <span class="truncate">${f.name}</span>
                    </div>
                    <div class="flex items-center gap-2 flex-shrink-0">
                        <span class="text-[10px] text-gray-400 font-medium">${(f.size / (1024*1024)).toFixed(1)} MB</span>
                        <button onclick="removeFile(${i})" class="w-6 h-6 rounded bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white transition flex items-center justify-center"><i class="fas fa-times text-[10px]"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // --- 3D ATOM YÜKLEME AĞI ---
        function startUpload() {
            if(selectedFilesData.length === 0) return;
            
            document.getElementById('spinner').classList.remove('hidden');
            document.getElementById('successIcon').classList.remove('success-animate');
            document.getElementById('successIcon').classList.add('hidden');
            document.getElementById('continueUploadBtn').classList.add('hidden');
            document.getElementById('progressBar').classList.remove('progress-success');
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').innerText = '0%';
            document.getElementById('uploadStatusTitle').innerText = 'Sisteme Aktarılıyor...';
            document.getElementById('uploadStatusTitle').classList.replace('text-green-400', 'text-white');
            document.getElementById('progressArea').classList.remove('hidden');
            document.getElementById('progressArea').style.display = 'flex';

            const formData = new FormData();
            formData.append('senderName', document.getElementById('senderNameInput').value || 'İsimsiz');
            formData.append('senderNote', document.getElementById('senderNoteInput').value || '');
            if(currentSessionFolderId) formData.append('existingFolderId', currentSessionFolderId);
            
            selectedFilesData.forEach(file => { formData.append('files', file); });

            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://tonoz-backend.onrender.com/api/upload', true);
            
            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percentComplete = Math.round((e.loaded / e.total) * 100);
                    document.getElementById('progressBar').style.width = percentComplete + '%';
                    document.getElementById('progressText').innerText = percentComplete + '%';
                    document.getElementById('speedText').innerText = (e.loaded / (1024*1024)).toFixed(1) + " MB / " + (e.total / (1024*1024)).toFixed(1) + " MB";
                }
            };

            xhr.onload = function() {
                if (xhr.status === 200) {
                    const result = JSON.parse(xhr.responseText);
                    if(result.folderId) currentSessionFolderId = result.folderId; 

                    document.getElementById('spinner').classList.add('hidden');
                    const succIcon = document.getElementById('successIcon');
                    succIcon.classList.remove('hidden');
                    succIcon.classList.add('success-animate'); 
                    
                    document.getElementById('uploadStatusTitle').innerText = "Aktarım Tamamlandı!";
                    document.getElementById('uploadStatusTitle').classList.replace('text-white', 'text-green-400');
                    document.getElementById('progressBar').classList.add('progress-success'); 
                    document.getElementById('speedText').innerText = "Tüm dosyalar Drive'da güvende.";
                    document.getElementById('continueUploadBtn').classList.remove('hidden');
                } else { alert("Hata: " + xhr.responseText); document.getElementById('progressArea').classList.add('hidden'); }
            };
            xhr.onerror = function() { alert("Sunucu bağlantısı koptu."); document.getElementById('progressArea').classList.add('hidden'); };
            xhr.send(formData);
        }

        function continueUpload() {
            document.getElementById('progressArea').classList.add('hidden');
            document.getElementById('progressArea').style.display = 'none';
            selectedFilesData = [];
            updateFileListUI();
        }

        // --- ADMİN PANELİ ---
        async function loadAdminData() {
            const container = document.getElementById('adminCardsContainer');
            container.innerHTML = '<div class="col-span-full py-20 flex flex-col items-center justify-center text-blue-400"><div class="atom-spinner w-16 h-16 mb-4"><div class="atom-ring atom-ring-1"></div><div class="atom-ring atom-ring-2"></div><div class="atom-ring atom-ring-3"></div><div class="atom-core"></div></div><p class="text-sm font-bold tracking-wider drop-shadow-md">Senkronize Ediliyor...</p></div>';
            try {
                const response = await fetch('https://tonoz-backend.onrender.com/api/files', { headers: { 'Authorization': 'Bearer ' + secureSessionToken } });
                const result = await response.json();
                if (result.success) { realAdminData = result.data; renderCards(realAdminData); } 
                else { container.innerHTML = `<div class="col-span-full text-red-400 text-center py-10">${result.message}</div>`; }
            } catch (error) { container.innerHTML = `<div class="col-span-full text-red-400 text-center py-10">Sunucu hatası.</div>`; }
        }

        function filterCards() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = realAdminData.filter(d => d.sender.toLowerCase().includes(query) || d.note.toLowerCase().includes(query) || d.files.some(f => f.name.toLowerCase().includes(query)));
            renderCards(filtered);
        }

        async function apiCall(url, method, bodyObj = null) {
            const options = { method: method, headers: { 'Authorization': 'Bearer ' + secureSessionToken, 'Content-Type': 'application/json' }};
            if(bodyObj) options.body = JSON.stringify(bodyObj);
            const res = await fetch(url, options);
            return await res.json();
        }

        async function deleteFile(fileId) {
            if(!confirm("Bu dosyayı kalıcı olarak silmek istediğine emin misin?")) return;
            const res = await apiCall(`https://tonoz-backend.onrender.com/api/delete/${fileId}`, 'DELETE');
            if(res.success) loadAdminData(); else alert("Silinemedi.");
        }

        async function deleteFolder(folderId) {
            if(!confirm("TÜM KLASÖRÜ kalıcı olarak silmek istediğine emin misin?")) return;
            const res = await apiCall(`https://tonoz-backend.onrender.com/api/delete/${folderId}`, 'DELETE');
            if(res.success) loadAdminData(); else alert("Silinemedi.");
        }

        function openEditModal(id, currentName, currentNote, timeStr) {
            document.getElementById('editFolderId').value = id; document.getElementById('editTimeStr').value = timeStr;
            document.getElementById('editSenderName').value = currentName; document.getElementById('editSenderNote').value = currentNote;
            document.getElementById('editModal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('editModal').style.opacity = '1'; }, 10);
        }
        function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

        async function saveEdit() {
            const id = document.getElementById('editFolderId').value;
            const body = { senderName: document.getElementById('editSenderName').value, note: document.getElementById('editSenderNote').value, timeStr: document.getElementById('editTimeStr').value };
            document.getElementById('editModal').querySelector('button.bg-blue-600').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            const res = await apiCall(`https://tonoz-backend.onrender.com/api/edit/${id}`, 'PUT', body);
            if(res.success) { closeEditModal(); loadAdminData(); } else { alert("Güncellenemedi."); }
            document.getElementById('editModal').querySelector('button.bg-blue-600').innerText = 'Kaydet';
        }

        function getIconData(m) {
            if (!m) return { icon: "fa-file", color: "text-gray-400" };
            if (m.includes('image/')) return { icon: "fa-image", color: "text-blue-400" };
            if (m.includes('video/')) return { icon: "fa-film", color: "text-pink-400" };
            if (m.includes('pdf')) return { icon: "fa-file-pdf", color: "text-red-400" };
            if (m.includes('zip')||m.includes('rar')) return { icon: "fa-file-archive", color: "text-yellow-400" };
            return { icon: "fa-file-alt", color: "text-blue-300" };
        }

        function setView(mode) { 
            currentMode = mode;
            document.getElementById('btnList').classList.toggle('glass-btn-active', mode === 'list');
            document.getElementById('btnList').classList.toggle('text-white', mode === 'list');
            document.getElementById('btnGrid').classList.toggle('glass-btn-active', mode === 'grid');
            document.getElementById('btnGrid').classList.toggle('text-white', mode === 'grid');
            filterCards(); 
        }

        function renderCards(dataList) {
            const container = document.getElementById('adminCardsContainer');
            if (dataList.length === 0) {
                container.innerHTML = '<div class="col-span-full py-10 flex items-center justify-center text-gray-500 text-sm">Kayıt bulunamadı.</div>';
                document.getElementById('globalSizeDisplay').innerText = "0 MB"; return;
            }

            let globalBytes = 0;
            realAdminData.forEach(d => d.files.forEach(f => globalBytes += parseInt(f.sizeBytes || 0)));
            document.getElementById('globalSizeDisplay').innerText = globalBytes > 1073741824 ? (globalBytes/1073741824).toFixed(2)+" GB" : (globalBytes/1048576).toFixed(1)+" MB";

            container.innerHTML = dataList.map(data => {
                let filesHTML = '';
                let totalMB = data.files.reduce((acc, f) => acc + (isNaN(parseFloat(f.size)) ? 0 : parseFloat(f.size)), 0).toFixed(1) + " MB";
                
                if(currentMode === 'list') {
                    filesHTML = `<div class="space-y-1.5 mt-3">` + data.files.map(f => {
                        const icon = getIconData(f.mimeType);
                        return `
                        <div class="flex justify-between items-center p-2 glass-panel rounded-lg hover:bg-white/10 transition group bg-black/30">
                            <div class="flex items-center gap-2 text-xs text-gray-200 overflow-hidden pr-1">
                                <i class="fas ${icon.icon} ${icon.color} w-4 text-center"></i> <span class="truncate" title="${f.name}">${f.name}</span>
                            </div>
                            <div class="flex items-center gap-1.5 flex-shrink-0">
                                <span class="text-[10px] text-gray-400 mr-1 font-medium">${f.size}</span>
                                <a href="${f.preview}" target="_blank" class="w-6 h-6 flex items-center justify-center rounded bg-blue-500/20 text-blue-400 hover:bg-blue-500 hover:text-white transition"><i class="fas fa-eye text-[10px]"></i></a>
                                <a href="${f.download}" target="_blank" class="w-6 h-6 flex items-center justify-center rounded bg-green-500/20 text-green-400 hover:bg-green-500 hover:text-white transition"><i class="fas fa-download text-[10px]"></i></a>
                                <button onclick="deleteFile('${f.id}')" class="w-6 h-6 flex items-center justify-center rounded bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white transition"><i class="fas fa-trash text-[10px]"></i></button>
                            </div>
                        </div>`;
                    }).join('') + `</div>`;
                } else {
                    filesHTML = `<div class="grid grid-cols-2 gap-2 mt-3">` + data.files.map(f => {
                        const icon = getIconData(f.mimeType);
                        let bgContent = f.thumb ? `<img src="${f.thumb}" class="w-full h-full object-cover opacity-70 group-hover:opacity-100 transition">` : `<div class="w-full h-full flex items-center justify-center bg-black/50"><i class="fas ${icon.icon} ${icon.color} text-2xl"></i></div>`;
                        return `
                        <div class="aspect-video relative rounded-lg overflow-hidden group border border-white/10 shadow-lg bg-black/40">
                            ${bgContent}
                            <div class="absolute inset-0 bg-black/70 opacity-0 group-hover:opacity-100 transition-all duration-300 flex items-center justify-center gap-1.5 backdrop-blur-sm z-10">
                                <a href="${f.preview}" target="_blank" class="w-7 h-7 flex items-center justify-center rounded-full bg-blue-500 hover:bg-blue-400 text-white transition shadow-[0_0_10px_rgba(59,130,246,0.6)]"><i class="fas fa-eye text-[10px]"></i></a>
                                <a href="${f.download}" target="_blank" class="w-7 h-7 flex items-center justify-center rounded-full bg-green-500 hover:bg-green-400 text-white transition shadow-[0_0_10px_rgba(34,197,94,0.6)]"><i class="fas fa-download text-[10px]"></i></a>
                                <button onclick="deleteFile('${f.id}')" class="w-7 h-7 flex items-center justify-center rounded-full bg-red-500 hover:bg-red-400 text-white transition shadow-[0_0_10px_rgba(239,68,68,0.6)]"><i class="fas fa-trash text-[10px]"></i></button>
                            </div>
                            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black to-transparent p-1.5 flex justify-between items-center z-0">
                                <span class="text-[9px] text-white truncate max-w-[60%] font-medium drop-shadow-md">${f.name}</span>
                                <span class="text-[8px] text-gray-300 font-bold drop-shadow-md">${f.size}</span>
                            </div>
                        </div>`;
                    }).join('') + `</div>`;
                }

                return `
                <div class="glass-3d p-4 flex flex-col transition-all relative group h-fit">
                    <div class="absolute top-4 right-4 flex gap-1.5 opacity-0 group-hover:opacity-100 transition-opacity z-20">
                        <button onclick="openEditModal('${data.id}', '${data.sender.replace(/'/g, "\\'")}', '${data.note.replace(/'/g, "\\'")}', '${data.timeStr}')" class="w-7 h-7 rounded bg-yellow-500/20 text-yellow-400 hover:bg-yellow-500 hover:text-white flex items-center justify-center transition" title="Düzenle"><i class="fas fa-pen text-[10px]"></i></button>
                        <button onclick="deleteFolder('${data.id}')" class="w-7 h-7 rounded bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white flex items-center justify-center transition" title="Tümünü Sil"><i class="fas fa-trash text-[10px]"></i></button>
                    </div>
                    <div class="border-b border-white/10 pb-3 mb-3 flex gap-3">
                        <div class="w-10 h-10 rounded-lg bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold shadow-[0_0_15px_rgba(59,130,246,0.2)] flex-shrink-0 border border-blue-400/30">${data.sender.charAt(0).toUpperCase()}</div>
                        <div class="overflow-hidden flex-grow pr-12">
                            <h3 class="font-bold text-white text-sm truncate" title="${data.sender}">${data.sender}</h3>
                            <p class="text-[9px] text-blue-300 mt-0.5"><i class="far fa-clock"></i> ${data.time}</p>
                        </div>
                    </div>
                    <div class="flex-grow flex flex-col">
                        ${data.note ? `<div class="text-xs text-gray-300 mb-3 glass-panel p-2.5 rounded-lg italic border-l-2 border-l-blue-400 overflow-hidden break-words bg-black/20">"${data.note}"</div>` : ''}
                        <div class="flex justify-between items-end mt-auto border-b border-white/10 pb-2">
                            <div class="flex flex-col">
                                <span class="text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1">İçerik (${data.files.length})</span>
                                <span class="text-[10px] font-bold text-white bg-black/50 px-2 py-1 rounded self-start border border-white/5">${totalMB}</span>
                            </div>
                            <a href="${data.folderLink}" target="_blank" class="text-[10px] font-bold text-white bg-blue-600/30 hover:bg-blue-600/50 px-2.5 py-1.5 rounded transition flex items-center gap-1.5 border border-blue-500/30">
                                <i class="fab fa-google-drive"></i> Klasörü Aç
                            </a>
                        </div>
                        ${filesHTML}
                    </div>
                </div>`;
            }).join('');
        }
    </script>
</body>
</html>
