<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>TonozShare - Premium Transfer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');
        
        html, body { width: 100vw; height: 100dvh; overflow: hidden; font-family: 'Outfit', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: pan-x pan-y; }
        input, textarea, button { touch-action: manipulation; }

        /* YENİ: YUMUŞAK GEÇİŞLİ CANLI RGB MESH ARKA PLAN (Kırmızı, Sarı, Pembe, Mor, Cyan) */
        .mesh-bg {
            position: fixed; inset: 0; z-index: -2;
            background: linear-gradient(-45deg, #ff0055, #ffaa00, #ff00cc, #00ffcc, #5500ff);
            background-size: 400% 400%; animation: rgbFlow 18s ease infinite;
        }
        /* Okunabilirliği artırmak için çok hafif bir karanlık cam filmi */
        .dark-overlay { position: fixed; inset: 0; background: rgba(5, 8, 15, 0.7); z-index: -1; }
        
        @keyframes rgbFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 3D CAM EFEKTİ */
        .glass-3d { 
            background: rgba(15, 20, 25, 0.55); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.2); border-left: 1px solid rgba(255, 255, 255, 0.1); border-bottom: 1px solid rgba(255, 255, 255, 0.05); border-right: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 0 20px rgba(255, 255, 255, 0.05); border-radius: 1.5rem; 
        }
        .glass-panel { background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.08); border-top: 1px solid rgba(255,255,255,0.15); box-shadow: inset 0 2px 10px rgba(0,0,0,0.3); }
        .glass-input { background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
        .glass-input:focus, .glass-btn-active { border-color: #3b82f6; box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); outline: none; background: rgba(0, 0, 0, 0.8); color: #60a5fa !important; }

        /* KÜÇÜLTÜLMÜŞ ORANTILI OTP KUTULARI */
        .otp-input { width: 40px; height: 48px; text-align: center; font-size: 1.25rem; font-weight: bold; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; transition: all 0.2s; -webkit-text-security: disc; }
        .otp-input:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59,130,246,0.4); outline: none; transform: translateY(-2px); background: rgba(0,0,0,0.6); }
        .otp-locked { border-color: #ef4444 !important; color: #ef4444 !important; box-shadow: 0 0 15px rgba(239,68,68,0.5) !important; animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        /* ANA TAŞIYICILAR */
        #app-container { display: flex; flex-direction: column; width: 100vw; height: 100dvh; position: relative; z-index: 10; overflow: hidden; }
        #views-container { flex-grow: 1; overflow-y: auto; overflow-x: hidden; position: relative; scroll-behavior: smooth; }
        .view-section { display: none; flex-direction: column; padding: 1rem; opacity: 0; transform: scale(0.95); transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); min-height: 100%; }
        .view-section.active { display: flex; opacity: 1; transform: scale(1); }

        /* RGB YÜKLEME BARI */
        .progress-track { background: rgba(0,0,0,0.7); border-radius: 99px; height: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); box-shadow: inset 0 2px 10px rgba(0,0,0,0.9); position: relative; }
        .progress-fill { height: 100%; border-radius: 99px; width: 0%; background: linear-gradient(90deg, #ff0055, #5500ff, #00ffcc, #3b82f6, #ff0055); background-size: 300% 100%; animation: fastRgbFlow 1.5s linear infinite; box-shadow: 0 0 20px rgba(0, 255, 204, 0.8); transition: width 0.2s ease-out; position: relative; }
        .progress-fill::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); animation: shine 1s linear infinite; }
        .progress-success { background: #22c55e !important; box-shadow: 0 0 30px rgba(34, 197, 94, 0.9) !important; animation: none !important; }
        .progress-success::after { display: none; }

        @keyframes fastRgbFlow { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
        @keyframes shine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* ATOM ANİMASYONU */
        .atom-spinner { width: 90px; height: 90px; position: relative; perspective: 800px; margin: 0 auto 1.5rem auto; }
        .atom-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
        .atom-ring-1 { border-top-color: #3b82f6; border-bottom-color: #3b82f6; animation: spinX 1.2s linear infinite; filter: drop-shadow(0 0 10px #3b82f6); }
        .atom-ring-2 { border-left-color: #00ffcc; border-right-color: #00ffcc; animation: spinY 1.5s linear infinite; filter: drop-shadow(0 0 10px #00ffcc); }
        .atom-core { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 18px; height: 18px; background: #fff; border-radius: 50%; box-shadow: 0 0 30px 10px #fff; animation: pulseCore 0.8s infinite alternate; }
        @keyframes spinX { 100% { transform: rotateX(360deg) rotateY(180deg); } }
        @keyframes spinY { 100% { transform: rotateY(360deg) rotateZ(180deg); } }
        @keyframes pulseCore { 0% { transform: translate(-50%, -50%) scale(0.8); } 100% { transform: translate(-50%, -50%) scale(1.3); } }

        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.3); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .success-animate { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .drop-zone { transition: all 0.3s ease; }
        .drop-zone.dragover { background: rgba(59, 130, 246, 0.15) !important; border-color: #3b82f6 !important; transform: scale(1.02); box-shadow: 0 0 30px rgba(59, 130, 246, 0.2); }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- SIVI RGB ARKA PLAN -->
    <div class="mesh-bg"></div>
    <div class="dark-overlay"></div>

    <div id="app-container">
        
        <!-- TEK VE SABİT ANA MENÜ BAR'I -->
        <header class="w-full glass-3d rounded-t-none border-t-0 border-x-0 rounded-b-3xl p-3 md:p-4 flex justify-between items-center z-30 shadow-2xl shrink-0 transition-all duration-300">
            <div class="w-full max-w-7xl mx-auto flex items-center justify-between gap-3 md:gap-4">
                
                <!-- SOL: TonozShare Logosu -->
                <div class="flex items-center gap-2 md:gap-3 cursor-pointer group shrink-0" onclick="switchView('uploadView')">
                    <div class="w-9 h-9 md:w-12 md:h-12 rounded-xl bg-gradient-to-tr from-blue-600 to-blue-300 flex items-center justify-center shadow-[0_0_20px_rgba(59,130,246,0.5)] transition-all transform group-hover:scale-105 border border-blue-400/30">
                        <i class="fas fa-bolt text-white text-base md:text-2xl"></i>
                    </div>
                    <!-- YAZI: Admin ekranında telefonda gizlenir -->
                    <h1 id="logoText" class="text-xl md:text-2xl font-extrabold tracking-tight drop-shadow-lg transition-all">
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-white">Tonoz</span><span class="text-blue-200 font-light">Share</span>
                    </h1>
                </div>

                <!-- ORTA: Akıllı Arama Çubuğu -->
                <div id="adminSearchBox" class="hidden flex-grow max-w-lg relative mx-2">
                    <i class="fas fa-search absolute left-3 top-2.5 md:top-3 text-gray-400 text-xs"></i>
                    <input type="text" id="searchInput" onkeyup="filterCards()" placeholder="Ara..." class="glass-input w-full pl-8 pr-3 py-2 md:py-2.5 rounded-xl text-xs md:text-sm font-medium shadow-inner transition-all">
                </div>

                <!-- SAĞ: Kontrol Butonları -->
                <div class="flex items-center gap-2 md:gap-3 shrink-0">
                    
                    <button id="navLoginBtn" onclick="switchView('loginView')" class="px-3.5 py-2 md:px-5 md:py-2.5 rounded-xl md:rounded-full glass-panel hover:bg-white/10 transition-all flex items-center gap-2 text-xs md:text-sm font-bold text-blue-400 border border-blue-500/30 shadow-lg">
                        <i class="fas fa-lock"></i> <span class="hidden sm:inline">Yönetim Paneli</span>
                    </button>

                    <!-- Admin Araçları -->
                    <div id="adminToolsBar" class="hidden items-center gap-2 md:gap-3 transition-all">
                        
                        <!-- Toplam MB Durumu (Artık Mobilde de Görünür) -->
                        <div class="flex glass-panel px-2.5 py-1.5 rounded-lg items-center shadow-lg border border-white/5">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse mr-1.5 drop-shadow-[0_0_5px_rgba(74,222,128,0.8)]"></span>
                            <div class="text-right border-l border-white/10 pl-1.5">
                                <p class="text-[7px] text-gray-400 uppercase font-bold leading-none mb-0.5">Toplam</p>
                                <p class="text-[10px] md:text-xs font-bold text-white leading-none" id="globalSizeDisplay">0 MB</p>
                            </div>
                        </div>

                        <!-- Liste / Kutu Görünümü -->
                        <div class="flex gap-1 bg-black/40 p-1 rounded-xl border border-white/10">
                            <button onclick="setView('list')" id="btnList" class="w-8 h-8 md:w-9 md:h-9 rounded-lg flex items-center justify-center transition glass-btn-active text-blue-400"><i class="fas fa-list text-xs md:text-sm"></i></button>
                            <button onclick="setView('grid')" id="btnGrid" class="w-8 h-8 md:w-9 md:h-9 rounded-lg flex items-center justify-center transition text-gray-400 hover:text-white"><i class="fas fa-th-large text-xs md:text-sm"></i></button>
                        </div>

                        <!-- Çıkış Butonu -->
                        <button id="navLogoutBtn" onclick="logoutAdmin()" class="w-9 h-9 md:w-11 md:h-11 rounded-xl bg-red-600/20 hover:bg-red-500/40 transition-all flex items-center justify-center text-red-400 border border-red-500/50 shadow-[0_0_15px_rgba(239,68,68,0.4)]" title="Çıkış Yap">
                            <i class="fas fa-power-off text-sm md:text-base"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- MERKEZİ EKRAN ALANI -->
        <div id="views-container">
            
            <!-- 1. YÜKLEME EKRANI -->
            <main id="uploadView" class="view-section active">
                <div class="glass-3d w-full max-w-4xl p-5 md:p-8 flex flex-col md:flex-row gap-6 relative mx-auto my-auto mt-4 md:mt-10">
                    <!-- Sol: Form -->
                    <div class="w-full md:w-1/2 flex flex-col gap-4">
                        <div class="text-left mb-2 hidden md:block">
                            <h2 class="text-2xl font-bold text-white mb-1 drop-shadow-md">Dosya Aktarımı</h2>
                            <p class="text-gray-400 text-xs">Drive alanına şifreli ve hızlı aktarım.</p>
                        </div>
                        <input type="text" id="senderNameInput" class="glass-input w-full px-5 py-3.5 rounded-xl text-sm font-medium" placeholder="Dosya Adı / Gönderen">
                        <textarea rows="2" id="senderNoteInput" class="glass-input w-full px-5 py-3.5 rounded-xl text-sm resize-none font-medium" placeholder="Notunuz (İsteğe Bağlı)..."></textarea>
                    </div>

                    <!-- Sağ: Sürükle Bırak / Animasyon -->
                    <div class="w-full md:w-1/2 relative min-h-[260px] flex flex-col glass-panel rounded-2xl p-4">
                        
                        <div id="defaultDropZone" class="drop-zone absolute inset-2 border-2 border-dashed border-white/20 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer group" onclick="document.getElementById('fileInput').click()">
                           <div class="w-20 h-20 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform duration-300 drop-shadow-[0_0_15px_rgba(59,130,246,0.6)]">
    <img src="upload-cloud.svg" alt="Yükleme Animasyonu" class="w-full h-full object-contain">
</div>
                            <h3 class="text-white font-bold text-base drop-shadow-md">Dosya / Klasör Sürükle</h3>
                            <p class="text-gray-400 text-[11px] mt-1">veya seçmek için tıkla</p>
                            <input type="file" id="fileInput" class="hidden" multiple>
                        </div>

                        <div id="activeDropZone" class="hidden flex-col h-full z-10 drop-zone rounded-xl">
                            <div class="flex justify-between items-center px-1 pb-2 border-b border-white/10 mb-2">
                                <span class="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Kuyruk (<span id="fileCount">0</span>)</span>
                                <span class="text-[10px] text-white font-bold bg-black/50 px-2 py-1 rounded border border-white/10" id="totalSizeText">0 MB</span>
                            </div>
                            <div id="fileListUI" class="flex-grow overflow-y-auto space-y-2 pr-1 h-32 md:h-40"></div>
                            <div class="flex gap-2 mt-3 pt-3 border-t border-white/10">
                                <button onclick="document.getElementById('fileInput').click()" class="flex-1 bg-black/40 hover:bg-black/60 text-white font-bold py-3 rounded-xl transition border border-white/10 text-xs">
                                    <i class="fas fa-plus"></i> Ekle
                                </button>
                                <button onclick="startUpload()" class="flex-[2] bg-gradient-to-r from-blue-600 to-blue-400 hover:from-blue-500 hover:to-blue-300 text-white font-bold py-3 rounded-xl transition shadow-[0_0_20px_rgba(59,130,246,0.5)] text-xs border border-blue-400/50">
                                    <i class="fas fa-rocket mr-1"></i> Başlat
                                </button>
                            </div>
                        </div>

                        <!-- 3D Atom Yükleme Ekranı -->
                        <div id="progressArea" class="hidden absolute inset-0 glass-3d rounded-2xl flex-col items-center justify-center p-6 text-center z-20">
                           <div id="spinner" class="w-24 h-24 flex items-center justify-center mb-4 drop-shadow-[0_0_20px_rgba(59,130,246,0.6)]">
    <img src="search-loading.svg" alt="Taranıyor" class="w-full h-full object-contain">
</div>
                            <i id="successIcon" class="fas fa-check-circle text-6xl text-green-400 hidden mb-6 drop-shadow-[0_0_30px_rgba(34,197,94,0.8)]"></i>
                            
                            <h3 id="uploadStatusTitle" class="text-white font-bold text-lg md:text-xl mb-4 drop-shadow-md">Sisteme Aktarılıyor...</h3>
                            
                            <div class="progress-track w-full mb-2"><div class="progress-fill" id="progressBar"></div></div>
                            <div class="flex justify-between text-[10px] font-bold w-full mb-4">
                                <span class="text-blue-400 drop-shadow-sm" id="progressText">0%</span>
                                <span class="text-gray-400" id="speedText">Hazırlanıyor...</span>
                            </div>
                            <button id="continueUploadBtn" onclick="continueUpload()" class="hidden w-full bg-white/10 hover:bg-white/20 text-white font-bold py-3 rounded-xl transition border border-white/20 text-xs mt-2">
                                <i class="fas fa-folder-plus mr-1"></i> Dosya Ekle
                            </button>
                        </div>
                    </div>
                </div>
                <!-- İMZA -->
                <div class="w-full max-w-4xl mx-auto mt-3 text-center opacity-40 shrink-0 mb-10 pointer-events-none">
                    <span class="text-[10px] font-bold tracking-[0.4em] text-white">CREATED BY TONOZ</span>
                </div>
            </main>

            <!-- 2. ŞİFRE EKRANI (Güvenlik Kalkanlı) -->
            <main id="loginView" class="view-section">
                <div class="glass-3d w-full max-w-[320px] md:max-w-sm p-6 md:p-8 text-center flex flex-col items-center mx-auto my-auto mt-6 md:mt-10">
                    <i class="fas fa-user-shield text-4xl md:text-5xl text-blue-400 mb-4 drop-shadow-[0_0_20px_rgba(59,130,246,0.6)]"></i>
                    <h2 class="text-lg md:text-xl font-bold text-white mb-1">Yönetici Doğrulama</h2>
                    <p id="loginSubtitle" class="text-[11px] md:text-xs text-gray-400 mb-6">Erişim için 6 haneli kodu girin.</p>
                    
                    <div class="flex gap-1.5 md:gap-2 justify-center w-full mb-6" id="otpContainer">
                        <input type="tel" inputmode="numeric" maxlength="1" class="otp-input">
                        <input type="tel" inputmode="numeric" maxlength="1" class="otp-input">
                        <input type="tel" inputmode="numeric" maxlength="1" class="otp-input">
                        <input type="tel" inputmode="numeric" maxlength="1" class="otp-input">
                        <input type="tel" inputmode="numeric" maxlength="1" class="otp-input">
                        <input type="tel" inputmode="numeric" maxlength="1" class="otp-input">
                    </div>

                    <div class="flex flex-col gap-2.5 w-full">
                        <button id="loginBtn" onclick="checkLogin()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-500 transition-colors shadow-[0_0_20px_rgba(59,130,246,0.4)] text-sm">
                            Giriş Yap
                        </button>
                        <button onclick="switchView('uploadView')" class="w-full glass-panel text-gray-300 font-bold py-3 rounded-xl hover:bg-white/10 transition-all border border-white/10 text-sm">
                            İptal (Geri Dön)
                        </button>
                    </div>
                </div>
                <div class="w-full max-w-sm mx-auto mt-3 text-center opacity-40 shrink-0 mb-10 pointer-events-none">
                    <span class="text-[10px] font-bold tracking-[0.4em] text-white">CREATED BY TONOZ</span>
                </div>
            </main>

            <!-- 3. ADMİN PANELİ -->
            <main id="adminView" class="view-section pb-12">
                <div class="w-full max-w-7xl mx-auto flex flex-col gap-5 mt-2">
                    <div id="adminCardsContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 content-start"></div>
                </div>
                <div class="w-full text-center mt-6 opacity-40 shrink-0 mb-10 pointer-events-none">
                    <span class="text-[10px] font-bold tracking-[0.4em] text-white">CREATED BY TONOZ</span>
                </div>
            </main>

        </div> <!-- Views Container Sonu -->
    </div> <!-- App Container Sonu -->

    <script>
        let currentMode = 'list';
        let selectedFilesData = [];
        let realAdminData = [];
        let secureSessionToken = '';
        let currentSessionFolderId = null;

        // EKRAN YÖNETİMİ
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => { el.classList.remove('active'); el.style.display = 'none'; });
            const target = document.getElementById(viewId);
            target.style.display = 'flex'; setTimeout(() => { target.classList.add('active'); }, 10);

            const isUpload = viewId === 'uploadView';
            const isAdmin = viewId === 'adminView';
            const logoText = document.getElementById('logoText');

            if(isAdmin) { logoText.classList.add('hidden', 'md:block'); } 
            else { logoText.classList.remove('hidden', 'md:block'); }

            document.getElementById('navLoginBtn').style.display = isUpload ? 'flex' : 'none';
            document.getElementById('adminSearchBox').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('adminToolsBar').style.display = isAdmin ? 'flex' : 'none';

            if(viewId === 'loginView') { 
                otpInputs.forEach(i => { i.value = ''; i.classList.remove('otp-locked'); }); 
                document.getElementById('loginSubtitle').innerText = "Erişim için 6 haneli kodu girin.";
                document.getElementById('loginSubtitle').classList.replace('text-red-400', 'text-gray-400');
                setTimeout(() => { otpInputs[0].focus(); }, 100); 
            }
        }

        // --- 6 HANELİ ŞİFRE (GÜVENLİK KALKANLI) ---
        const otpInputs = document.querySelectorAll('#otpContainer input');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                otpInputs.forEach(i => i.classList.remove('otp-locked'));
                document.getElementById('loginSubtitle').classList.replace('text-red-400', 'text-gray-400');
                document.getElementById('loginSubtitle').innerText = "Erişim için 6 haneli kodu girin.";

                if (e.target.value.length === 1 && index < otpInputs.length - 1) { otpInputs[index + 1].focus(); }
                checkAutoSubmit();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) { otpInputs[index - 1].focus(); }
            });
        });

        function checkAutoSubmit() {
            const pwd = Array.from(otpInputs).map(i => i.value).join('');
            if(pwd.length === 6) { checkLogin(); }
        }

        async function checkLogin() {
            const pwd = Array.from(otpInputs).map(i => i.value).join('');
            const btn = document.getElementById('loginBtn');
            const subTitle = document.getElementById('loginSubtitle');
            if(pwd.length < 6) return;
            
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Doğrulanıyor...'; btn.disabled = true;
            try {
                const response = await fetch('https://tonoz-backend.onrender.com/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd })
                });
                const result = await response.json();
                
                if (result.success) { 
                    secureSessionToken = result.token; switchView('adminView'); loadAdminData(); 
                } else { 
                    otpInputs.forEach(i => { i.value = ''; i.classList.add('otp-locked'); });
                    otpInputs[0].focus();
                    subTitle.innerText = result.message || "Hatalı Şifre!";
                    subTitle.classList.replace('text-gray-400', 'text-red-400');
                }
            } catch (err) { alert("Sunucuya bağlanılamadı."); }
            btn.innerHTML = 'Giriş Yap'; btn.disabled = false;
        }

        function logoutAdmin() { secureSessionToken = ''; switchView('uploadView'); }

        // SÜRÜKLE BIRAK
        const dropZones = [document.getElementById('defaultDropZone'), document.getElementById('activeDropZone')];
        const fileInput = document.getElementById('fileInput');
        dropZones.forEach(dz => {
            dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
            dz.addEventListener('dragleave', e => { e.preventDefault(); dz.classList.remove('dragover'); });
            dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
        });
        fileInput.addEventListener('change', e => { handleFiles(e.target.files); fileInput.value = ''; });

        function handleFiles(files) {
            if(files.length === 0) return;
            if(!document.getElementById('progressArea').classList.contains('hidden') && !document.getElementById('successIcon').classList.contains('hidden')) { continueUpload(); }
            selectedFilesData = selectedFilesData.concat(Array.from(files));
            updateFileListUI();
        }

        function removeFile(index) { selectedFilesData.splice(index, 1); updateFileListUI(); }

        function updateFileListUI() {
            if(selectedFilesData.length === 0) {
                document.getElementById('activeDropZone').classList.add('hidden'); document.getElementById('activeDropZone').classList.remove('flex');
                document.getElementById('defaultDropZone').classList.remove('hidden'); return;
            }
            document.getElementById('defaultDropZone').classList.add('hidden');
            document.getElementById('activeDropZone').classList.remove('hidden'); document.getElementById('activeDropZone').classList.add('flex');
            
            let totalBytes = selectedFilesData.reduce((acc, file) => acc + file.size, 0);
            let totalMB = (totalBytes / (1024*1024)).toFixed(2);
            document.getElementById('fileCount').innerText = selectedFilesData.length;
            document.getElementById('totalSizeText').innerText = totalMB + " MB";
            
            document.getElementById('fileListUI').innerHTML = selectedFilesData.map((f, i) => `
                <div class="glass-panel p-2 rounded-lg flex justify-between items-center group border border-white/5 bg-black/40">
                    <div class="flex items-center gap-2 text-xs text-gray-200 truncate pr-1">
                        <i class="fas fa-file-alt text-blue-400"></i> <span class="truncate">${f.name}</span>
                    </div>
                    <div class="flex items-center gap-2 flex-shrink-0">
                        <span class="text-[10px] text-gray-400 font-medium">${(f.size / (1024*1024)).toFixed(1)} MB</span>
                        <button onclick="removeFile(${i})" class="w-6 h-6 rounded bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white transition flex items-center justify-center"><i class="fas fa-times text-[10px]"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // YÜKLEME
        function startUpload() {
            if(selectedFilesData.length === 0) return;
            document.getElementById('spinner').classList.remove('hidden');
            document.getElementById('successIcon').classList.remove('success-animate'); document.getElementById('successIcon').classList.add('hidden');
            document.getElementById('continueUploadBtn').classList.add('hidden');
            document.getElementById('progressBar').classList.remove('progress-success');
            document.getElementById('progressBar').style.width = '0%'; document.getElementById('progressText').innerText = '0%';
            document.getElementById('uploadStatusTitle').innerText = 'Sisteme Aktarılıyor...'; document.getElementById('uploadStatusTitle').classList.replace('text-green-400', 'text-white');
            document.getElementById('progressArea').classList.remove('hidden'); document.getElementById('progressArea').style.display = 'flex';

            const formData = new FormData();
            formData.append('senderName', document.getElementById('senderNameInput').value || 'İsimsiz');
            formData.append('senderNote', document.getElementById('senderNoteInput').value || '');
            if(currentSessionFolderId) formData.append('existingFolderId', currentSessionFolderId);
            selectedFilesData.forEach(file => { formData.append('files', file); });

            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://tonoz-backend.onrender.com/api/upload', true);
            
            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percentComplete = Math.round((e.loaded / e.total) * 100);
                    document.getElementById('progressBar').style.width = percentComplete + '%';
                    document.getElementById('progressText').innerText = percentComplete + '%';
                    document.getElementById('speedText').innerText = (e.loaded / (1024*1024)).toFixed(1) + " MB / " + (e.total / (1024*1024)).toFixed(1) + " MB";
                }
            };

            xhr.onload = function() {
                if (xhr.status === 200) {
                    const result = JSON.parse(xhr.responseText);
                    if(result.folderId) currentSessionFolderId = result.folderId; 

                    document.getElementById('spinner').classList.add('hidden');
                    const succIcon = document.getElementById('successIcon');
                    succIcon.classList.remove('hidden'); succIcon.classList.add('success-animate'); 
                    
                    document.getElementById('uploadStatusTitle').innerText = "Aktarım Tamamlandı!";
                    document.getElementById('uploadStatusTitle').classList.replace('text-white', 'text-green-400');
                    document.getElementById('progressBar').classList.add('progress-success'); 
                    document.getElementById('speedText').innerText = "Tüm dosyalar Drive'da güvende.";
                    document.getElementById('continueUploadBtn').classList.remove('hidden');
                } else { alert("Hata: " + xhr.responseText); document.getElementById('progressArea').classList.add('hidden'); }
            };
            xhr.onerror = function() { alert("Sunucu bağlantısı koptu."); document.getElementById('progressArea').classList.add('hidden'); };
            xhr.send(formData);
        }

        function continueUpload() {
            document.getElementById('progressArea').classList.add('hidden'); document.getElementById('progressArea').style.display = 'none';
            selectedFilesData = []; updateFileListUI();
        }

        // ADMİN PANELİ (Kartlar, Paylaşım Linki)
        async function loadAdminData() {
            const container = document.getElementById('adminCardsContainer');
           container.innerHTML = '<div class="col-span-full py-20 flex flex-col items-center justify-center text-blue-400"><div class="w-20 h-20 mb-4 drop-shadow-[0_0_15px_rgba(59,130,246,0.6)]"><img src="search-loading.svg" alt="Senkronize" class="w-full h-full object-contain"></div><p class="text-sm font-bold tracking-wider drop-shadow-md">Sistem Taranıyor ve Senkronize Ediliyor...</p></div>';
            try {
                const response = await fetch('https://tonoz-backend.onrender.com/api/files', { headers: { 'Authorization': 'Bearer ' + secureSessionToken } });
                const result = await response.json();
                if (result.success) { realAdminData = result.data; renderCards(realAdminData); } 
                else { container.innerHTML = `<div class="col-span-full text-red-400 text-center py-10">${result.message}</div>`; }
            } catch (error) { container.innerHTML = `<div class="col-span-full text-red-400 text-center py-10">Sunucu hatası.</div>`; }
        }

        function filterCards() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = realAdminData.filter(d => d.sender.toLowerCase().includes(query) || d.note.toLowerCase().includes(query) || d.files.some(f => f.name.toLowerCase().includes(query)));
            renderCards(filtered);
        }

        async function apiCall(url, method, bodyObj = null) {
            const options = { method: method, headers: { 'Authorization': 'Bearer ' + secureSessionToken, 'Content-Type': 'application/json' }};
            if(bodyObj) options.body = JSON.stringify(bodyObj);
            const res = await fetch(url, options); return await res.json();
        }

        async function deleteFile(fileId) {
            if(!confirm("Bu dosyayı kalıcı olarak silmek istediğine emin misin?")) return;
            const res = await apiCall(`https://tonoz-backend.onrender.com/api/delete/${fileId}`, 'DELETE');
            if(res.success) loadAdminData(); else alert("Silinemedi.");
        }

        async function deleteFolder(folderId) {
            if(!confirm("TÜM KLASÖRÜ kalıcı olarak silmek istediğine emin misin?")) return;
            const res = await apiCall(`https://tonoz-backend.onrender.com/api/delete/${folderId}`, 'DELETE');
            if(res.success) loadAdminData(); else alert("Silinemedi.");
        }

        function copyShareLink(folderId, btnElement) {
            const link = `https://tonoz-backend.onrender.com/api/share/${folderId}`;
            navigator.clipboard.writeText(link).then(() => {
                const icon = btnElement.querySelector('i');
                icon.className = 'fas fa-check text-green-400';
                setTimeout(() => { icon.className = 'fas fa-link text-xs'; }, 2000);
            });
        }

        function getIconData(m) {
            if (!m) return { icon: "fa-file", color: "text-gray-400" };
            if (m.includes('image/')) return { icon: "fa-image", color: "text-blue-400" };
            if (m.includes('video/')) return { icon: "fa-film", color: "text-pink-400" };
            if (m.includes('pdf')) return { icon: "fa-file-pdf", color: "text-red-400" };
            if (m.includes('zip')||m.includes('rar')) return { icon: "fa-file-archive", color: "text-yellow-400" };
            return { icon: "fa-file-alt", color: "text-blue-300" };
        }

        function setView(mode) { 
            const btnGrid = document.getElementById('btnGrid');
            const btnList = document.getElementById('btnList');
            currentMode = mode;
            if(mode === 'list') {
                btnList.classList.add('glass-btn-active', 'text-blue-400'); btnList.classList.remove('text-gray-400', 'hover:text-white');
                btnGrid.classList.remove('glass-btn-active', 'text-blue-400'); btnGrid.classList.add('text-gray-400', 'hover:text-white');
            } else {
                btnGrid.classList.add('glass-btn-active', 'text-blue-400'); btnGrid.classList.remove('text-gray-400', 'hover:text-white');
                btnList.classList.remove('glass-btn-active', 'text-blue-400'); btnList.classList.add('text-gray-400', 'hover:text-white');
            }
            filterCards(); 
        }

        function renderCards(dataList) {
            const container = document.getElementById('adminCardsContainer');
            if (dataList.length === 0) {
                container.innerHTML = '<div class="col-span-full py-10 flex items-center justify-center text-gray-500 text-sm">Kayıt bulunamadı.</div>';
                document.getElementById('globalSizeDisplay').innerText = "0 MB"; return;
            }

            let globalBytes = 0;
            realAdminData.forEach(d => d.files.forEach(f => globalBytes += parseInt(f.sizeBytes || 0)));
            document.getElementById('globalSizeDisplay').innerText = globalBytes > 1073741824 ? (globalBytes/1073741824).toFixed(2)+" GB" : (globalBytes/1048576).toFixed(1)+" MB";

            container.innerHTML = dataList.map(data => {
                let filesHTML = '';
                let totalMB = data.files.reduce((acc, f) => acc + (isNaN(parseFloat(f.size)) ? 0 : parseFloat(f.size)), 0).toFixed(1) + " MB";
                
                if(currentMode === 'list') {
                    filesHTML = `<div class="space-y-1.5 mt-3">` + data.files.map(f => {
                        const icon = getIconData(f.mimeType);
                        const filePreviewUrl = `https://tonoz-backend.onrender.com/api/file/${f.id}?action=preview&token=${secureSessionToken}`;
                        const fileDownloadUrl = `https://tonoz-backend.onrender.com/api/file/${f.id}?action=download&token=${secureSessionToken}`;
                        return `
                        <div class="flex justify-between items-center p-2 glass-panel rounded-lg hover:bg-white/10 transition group bg-black/30">
                            <div class="flex items-center gap-2 text-xs text-gray-200 overflow-hidden pr-1">
                                <i class="fas ${icon.icon} ${icon.color} w-4 text-center"></i> <span class="truncate" title="${f.name}">${f.name}</span>
                            </div>
                            <div class="flex items-center gap-1.5 flex-shrink-0">
                                <span class="text-[10px] text-gray-400 mr-1 font-medium">${f.size}</span>
                                <a href="${filePreviewUrl}" target="_blank" class="w-6 h-6 flex items-center justify-center rounded bg-blue-500/20 text-blue-400 hover:bg-blue-500 hover:text-white transition"><i class="fas fa-eye text-[10px]"></i></a>
                                <a href="${fileDownloadUrl}" target="_blank" class="w-6 h-6 flex items-center justify-center rounded bg-green-500/20 text-green-400 hover:bg-green-500 hover:text-white transition"><i class="fas fa-download text-[10px]"></i></a>
                                <button onclick="deleteFile('${f.id}')" class="w-6 h-6 flex items-center justify-center rounded bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white transition"><i class="fas fa-trash text-[10px]"></i></button>
                            </div>
                        </div>`;
                    }).join('') + `</div>`;
                } else {
                    filesHTML = `<div class="grid grid-cols-2 gap-2 mt-3">` + data.files.map(f => {
                        const icon = getIconData(f.mimeType);
                        const filePreviewUrl = `https://tonoz-backend.onrender.com/api/file/${f.id}?action=preview&token=${secureSessionToken}`;
                        const fileDownloadUrl = `https://tonoz-backend.onrender.com/api/file/${f.id}?action=download&token=${secureSessionToken}`;
                        let bgContent = f.thumb ? `<img src="${f.thumb}" class="w-full h-full object-cover opacity-70 group-hover:opacity-100 transition">` : `<div class="w-full h-full flex items-center justify-center bg-black/50"><i class="fas ${icon.icon} ${icon.color} text-2xl"></i></div>`;
                        return `
                        <div class="aspect-video relative rounded-lg overflow-hidden group border border-white/10 shadow-lg bg-black/40">
                            ${bgContent}
                            <div class="absolute inset-0 bg-black/80 opacity-0 group-hover:opacity-100 transition-all duration-300 flex items-center justify-center gap-1.5 backdrop-blur-sm z-10">
                                <a href="${filePreviewUrl}" target="_blank" class="w-7 h-7 flex items-center justify-center rounded-full bg-blue-500 hover:bg-blue-400 text-white transition shadow-[0_0_10px_rgba(59,130,246,0.6)]"><i class="fas fa-eye text-[10px]"></i></a>
                                <a href="${fileDownloadUrl}" target="_blank" class="w-7 h-7 flex items-center justify-center rounded-full bg-green-500 hover:bg-green-400 text-white transition shadow-[0_0_10px_rgba(34,197,94,0.6)]"><i class="fas fa-download text-[10px]"></i></a>
                                <button onclick="deleteFile('${f.id}')" class="w-7 h-7 flex items-center justify-center rounded-full bg-red-500 hover:bg-red-400 text-white transition shadow-[0_0_10px_rgba(239,68,68,0.6)]"><i class="fas fa-trash text-[10px]"></i></button>
                            </div>
                            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black to-transparent p-1.5 flex justify-between items-center z-0">
                                <span class="text-[9px] text-white truncate max-w-[60%] font-medium drop-shadow-md">${f.name}</span>
                                <span class="text-[8px] text-gray-300 font-bold drop-shadow-md">${f.size}</span>
                            </div>
                        </div>`;
                    }).join('') + `</div>`;
                }

                const zipDownloadUrl = `https://tonoz-backend.onrender.com/api/download-folder/${data.id}?token=${secureSessionToken}`;

                return `
                <div class="glass-3d p-5 flex flex-col transition-all relative group h-fit">
                    <!-- PAYLAŞIM VE DÜZENLEME BUTONLARI EKLENDİ -->
                    <div class="absolute top-5 right-5 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity z-20">
                        <button onclick="copyShareLink('${data.id}', this)" class="w-8 h-8 rounded bg-green-500/20 text-green-400 hover:bg-green-500 hover:text-white flex items-center justify-center transition border border-green-500/30" title="İndirme Linkini Kopyala (Şifresiz Paylaşım)"><i class="fas fa-link text-xs"></i></button>
                        <button onclick="deleteFolder('${data.id}')" class="w-8 h-8 rounded bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white flex items-center justify-center transition border border-red-500/30" title="Tümünü Sil"><i class="fas fa-trash text-xs"></i></button>
                    </div>
                    <div class="border-b border-white/10 pb-4 mb-4 flex gap-4">
                        <div class="w-12 h-12 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-lg font-bold shadow-[0_0_15px_rgba(59,130,246,0.2)] flex-shrink-0 border border-blue-400/30">${data.sender.charAt(0).toUpperCase()}</div>
                        <div class="overflow-hidden flex-grow pr-20">
                            <h3 class="font-bold text-white text-base truncate" title="${data.sender}">${data.sender}</h3>
                            <p class="text-[10px] text-cyan-300 mt-1"><i class="far fa-clock"></i> ${data.time}</p>
                        </div>
                    </div>
                    <div class="flex-grow flex flex-col">
                        ${data.note ? `<div class="text-sm text-gray-300 mb-4 glass-panel p-3 rounded-lg italic border-l-2 border-l-blue-400 overflow-hidden break-words bg-black/20">"${data.note}"</div>` : ''}
                        <div class="flex justify-between items-end mt-auto border-b border-white/10 pb-3">
                            <div class="flex flex-col">
                                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">İçerik (${data.files.length})</span>
                                <span class="text-xs font-bold text-white bg-black/50 px-2.5 py-1 rounded self-start border border-white/5">${totalMB}</span>
                            </div>
                            <a href="${zipDownloadUrl}" class="text-xs font-bold text-white bg-blue-600/40 hover:bg-blue-500 px-3 py-2 rounded-lg transition flex items-center gap-2 border border-blue-500/50 shadow-lg">
                                <i class="fas fa-file-archive"></i> Tümünü İndir (ZIP)
                            </a>
                        </div>
                        ${filesHTML}
                    </div>
                </div>`;
            }).join('');
        }
        
        setView('list');
    </script>
</body>
</html>
